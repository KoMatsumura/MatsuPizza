<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>
      <a href="index.html" class="logo">
        <img src="img/logo001.png" alt="まつピザのロゴ">
      </a> 
    </h1>
    <nav>
      <ul>
        <li><a href="menu.html">メニュー</a></li>
        <li><a href="osirase.html">お知らせ</a></li>
        <li><a href="yoyaku.html">ご予約</a></li>
        <li><a href="toiawase.html">お問い合わせ</a></li>
        <li>
          <button id="dark-mode-button" class="dark-mode-button">🌙</button>
        </li>
      </ul>
    </nav>
  </header>

  <main class="lower-main">
    <div class="page-heading">
      <h2>お問い合わせ</h2>
      <p >ご不明点などがあれば、お気軽にお問い合わせください。</p>
    </div>
    <form class="form-box" action="https://api.staticforms.dev/submit" method="post">
      <input type="hidden" name="accessKey" value="sf_b2d466307fc4be7ffbe25001">
      <input type="hidden" name="redirectTo" value="https://komatsumura.github.io/MatsuPizza/toiawase-thanks.html">
      <div class="form-item">
        <label for="visit-date">ご来店日</label>
        <input type="date" id="visit-date" name="visit_date" required>
      </div>
      <div class="form-item">
        <label for="visit-time">ご来店時間</label>
        <select id="visit-time" name="visit_time" required>
          <option value="">選択してください</option>
          <option value="11:00">11時</option>
          <option value="12:00">12時</option>
          <option value="13:00">13時</option>
          <option value="14:00">14時</option>
          <option value="15:00">15時</option>
          <option value="16:00">16時</option>
          <option value="17:00">17時</option>
          <option value="18:00">18時</option>
          <option value="19:00">19時</option>
          <option value="20:00">20時</option>
          <option value="21:00">21時</option>
        </select>
      </div>
      <div class="form-item">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" placeholder="例）山田 太郎" required>
      </div>
      <div class="form-item">
        <label for="kana">ふりがな</label>
        <input type="text" id="kana" name="kana" placeholder="例）やまだ たろう" required>
      </div>
      <div class="form-item">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="例）example@example.com" required>
      </div>
      <div class="form-item">
        <label for="tel">電話番号</label>
        <input type="tel" id="tel" name="phone" placeholder="例）090-1234-5678" required>
      </div>
      <div class="form-item">
        <label>性別</label>
        <div class="radio-group">
          <label>
            <input type="radio" name="gender" value="回答しない" checked>回答しない
          </label>
          <label>
            <input type="radio" name="gender" value="女性">女性
          </label>
          <label>
            <input type="radio" name="gender" value="男性">男性
          </label>
        </div>
      </div>
      <div class="form-item">
        <label for="age">年齢</label>
        <select id="age" name="age" required>
          <option value="">選択してください</option>
          <option value="10代">10代</option>
          <option value="20代">20代</option>
          <option value="30代">30代</option>
          <option value="40代">40代</option>
          <option value="50代">50代</option>
          <option value="60歳以上">60歳以上</option>
        </select>
      </div>
      <div class="form-item">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" rows="7" placeholder="お問い合わせ内容をご入力ください。" required></textarea>
      </div>
      <div class="form-item">
        <button type="submit">送信する</button>
      </div>
    </form>
  </main>

  <footer>
    <div class="footer-content">
      <nav>
        <ul>
          <li><a href="menu.html">メニュー</a></li>
          <li><a href="osirase.html">お知らせ</a></li>
          <li><a href="yoyaku.html">ご予約</a></li>
          <li><a href="toiawase.html">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
    <p class="copyright">&copy; 2026 MATSU PIZZA</p>
  </footer>
</body>
</html>
